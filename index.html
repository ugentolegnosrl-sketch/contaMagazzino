<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Conta Magazzino</title>
<style>
  :root {
    --bg: #0d1017;
    --panel: #161b24;
    --panel-2: #1e2532;
    --text: #f4f7fb;
    --muted: #93a0b4;
    --accent: #4d9fff;
    --accent-2: #54e08a;
    --danger: #ff6b6b;
    --warning: #f5c451;
    --border: #2b3444;
    --radius: 16px;
    --shadow: 0 8px 22px rgba(0,0,0,0.3);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font); min-height:100%; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .app { max-width: 820px; margin: 0 auto; padding: 12px 12px 40px; }

  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: linear-gradient(180deg, var(--bg) 60%, rgba(13,16,23,0.92));
    padding: 10px 0 12px;
  }
  .title-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  h1 { font-size: 1.15rem; margin:0; font-weight:800; letter-spacing:0.01em; }
  .muted { color: var(--muted); }
  .tiny { font-size: 0.78rem; }
  .small { font-size: 0.9rem; }
  .hidden { display:none !important; }

  .menu-btn {
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    border-radius:12px; padding:8px 12px; font:inherit; cursor:pointer; min-height:40px;
  }

  .search-wrap { position: relative; }
  #searchInput {
    width:100%; padding:16px 44px 16px 16px; font-size:1.15rem;
    border:2px solid var(--border); background:var(--panel); color:var(--text);
    border-radius:14px; outline:none; font-weight:600;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--muted); font-weight:400; }
  .clear-search {
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border-radius:50%; border:0;
    background:var(--panel-2); color:var(--muted); font-size:1.1rem;
    cursor:pointer; display:grid; place-items:center;
  }
  .search-hint { margin-top:6px; font-size:0.78rem; color:var(--muted); padding-left:4px; }

  .totals-strip {
    display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;
  }
  .total-chip {
    flex:1; min-width:0; background:var(--panel-2); border:1px solid var(--border);
    border-radius:12px; padding:8px 10px; text-align:center;
  }
  .total-chip .n { font-weight:800; font-size:1.05rem; }
  .total-chip.green .n { color: var(--accent-2); }
  .total-chip.blue .n { color: var(--accent); }

  .results { margin-top:14px; display:flex; flex-direction:column; gap:10px; }

  .product-card {
    background: var(--panel); border:1px solid var(--border);
    border-radius: var(--radius); padding:14px;
    transition: border-color 0.12s;
  }
  .product-card.has-qty { border-color: rgba(84,224,138,0.4); }
  .product-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(77,159,255,0.18); }

  .pc-top { display:grid; grid-template-columns: 1fr auto; gap:12px; align-items:center; cursor:pointer; }
  .pc-name { font-size:1.05rem; font-weight:700; line-height:1.25; word-break:break-word; }
  .pc-dims { margin-top:4px; font-size:0.92rem; color:var(--muted); font-variant-numeric: tabular-nums; }
  .pc-dims .x { opacity:0.5; margin:0 2px; }
  .pc-qty {
    min-width:74px; text-align:center;
    background:var(--panel-2); border-radius:14px; padding:8px 6px;
    border:1px solid var(--border);
  }
  .pc-qty .val { font-size:1.7rem; font-weight:800; line-height:1; font-variant-numeric: tabular-nums; }
  .pc-qty.has .val { color: var(--accent-2); }
  .pc-qty .unit { font-size:0.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }

  /* Pannello azioni espanso */
  .pc-actions { margin-top:14px; display:none; }
  .product-card.selected .pc-actions { display:block; }

  .add-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
  .add-btn {
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    border-radius:12px; padding:16px 6px; font-size:1.2rem; font-weight:800;
    cursor:pointer; transition:0.1s; min-height:58px;
  }
  .add-btn:active { transform:scale(0.94); }
  .add-btn.plus { background:rgba(84,224,138,0.14); color:var(--accent-2); border-color:rgba(84,224,138,0.3); }
  .add-btn.manual { background:rgba(77,159,255,0.14); color:var(--accent); border-color:rgba(77,159,255,0.3); font-size:0.95rem; }

  .secondary-row {
    margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .mini-btn {
    border:1px solid var(--border); background:transparent; color:var(--muted);
    border-radius:10px; padding:8px 12px; font:inherit; font-size:0.85rem; cursor:pointer;
  }
  .mini-btn.minus { color:var(--danger); border-color:rgba(255,107,107,0.25); }

  .empty {
    padding:40px 16px; text-align:center; color:var(--muted);
    border:1px dashed var(--border); border-radius:14px; background:rgba(255,255,255,0.015);
  }

  /* Modal generica */
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:90; display:grid; place-items:center; padding:16px; }
  .modal { width:100%; max-width:440px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow:var(--shadow); }
  .modal h3 { margin:0 0 4px; }
  .modal .row { display:flex; gap:8px; }
  .modal input[type=number], .modal input[type=text] {
    width:100%; padding:14px; font-size:1.3rem; text-align:center; font-weight:700;
    border:2px solid var(--border); background:var(--panel-2); color:var(--text); border-radius:12px; outline:none;
  }
  .modal input:focus { border-color:var(--accent); }
  .btn { border:1px solid var(--border); background:var(--panel-2); color:var(--text); border-radius:12px; padding:13px; font:inherit; cursor:pointer; min-height:48px; font-weight:700; }
  .btn.primary { background:var(--accent); color:#06101e; border-color:transparent; }
  .btn.ghost { background:transparent; }
  .btn.full { width:100%; }
  .note { margin-top:10px; padding:10px 12px; border-radius:12px; background:rgba(77,159,255,0.08); border:1px solid rgba(77,159,255,0.18); color:#d3e7ff; font-size:0.88rem; }

  /* Menu a tendina */
  .menu-sheet { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,0.5); display:flex; align-items:flex-start; justify-content:flex-end; padding:12px; }
  .menu-card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:8px; min-width:220px; box-shadow:var(--shadow); }
  .menu-item { display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--text); padding:13px 14px; border-radius:10px; font:inherit; cursor:pointer; }
  .menu-item:hover { background:var(--panel-2); }
  .menu-item.danger { color:var(--danger); }
  .menu-sep { height:1px; background:var(--border); margin:6px 8px; }

  .flash {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--accent-2); color:#06180c; font-weight:800;
    padding:10px 20px; border-radius:999px; z-index:120;
    box-shadow:var(--shadow); opacity:0; transition:opacity 0.2s, transform 0.2s;
    pointer-events:none; font-size:0.95rem;
  }
  .flash.show { opacity:1; transform:translateX(-50%) translateY(-4px); }

  @media (max-width:420px){
    .pc-qty { min-width:64px; }
    .pc-qty .val { font-size:1.5rem; }
  }
</style>
</head>

<div class="app">
  <div class="topbar">
    <div class="title-row">
      <h1>Conta Magazzino</h1>
      <button class="menu-btn" id="menuBtn">☰ Menu</button>
    </div>

      <div class="total-chip green"><div class="tiny muted">Pezzi totali</div><div class="n" id="statPieces">0</div></div>
    </div>
  </div>

  <div id="results" class="results"></div>
</div>

<div id="flash" class="flash"></div>
<div id="modalRoot" class="hidden"></div>
<div id="menuRoot" class="hidden"></div>

/* ---- ID stabile per prodotto ---- */
function prodId(p) {
  return [p.nome, p.lunghezza, p.larghezza, p.spessore].join('|');
}

/* ---- Persistenza ---- */
function persist() {
  const qtyMap = {};
  state.products.forEach(p => { if (p.qty) qtyMap[p.id] = p.qty; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ qtyMap, savedAt: new Date().toISOString() }));
}

function loadProducts() {
  // Carico il seed e applico le quantità salvate
  let qtyMap = {};
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) qtyMap = JSON.parse(raw).qtyMap || {};
  } catch {}
  // Eventuali prodotti aggiunti a mano salvati separatamente
  let custom = [];
  try {
    const raw = localStorage.getItem(STORAGE_KEY + '_custom');
    if (raw) custom = JSON.parse(raw) || [];
  } catch {}

  const all = [...SEED, ...custom];
  state.products = all.map(p => {
    const id = prodId(p);
    return { id, nome: p.nome, lunghezza: p.lunghezza, larghezza: p.larghezza, spessore: p.spessore, qty: qtyMap[id] || 0 };
  });
}

function persistCustom() {
  const custom = state.products
    .filter(p => p._custom)
    .map(p => ({ nome:p.nome, lunghezza:p.lunghezza, larghezza:p.larghezza, spessore:p.spessore, _custom:true }));
  localStorage.setItem(STORAGE_KEY + '_custom', JSON.stringify(custom));
}

/* ---- Ricerca multi-token ordine libero ---- */
function normalize(s){ return String(s||'').toUpperCase().replace(/\s+/g,' ').trim(); }

function matchProduct(p, tokens) {
  // Ogni token deve matchare: una parola del nome (prefisso) OPPURE una delle 3 misure
  const nameWords = normalize(p.nome).split(' ');
  const dims = [String(p.lunghezza), String(p.larghezza), String(p.spessore)];
  return tokens.every(tok => {
    const t = tok.toUpperCase();
    const isNumeric = /^[0-9]+([.,][0-9]+)?$/.test(t);
    let numMatch = false;
    if (isNumeric) {
      // Esatto su qualunque dimensione, oppure prefisso SOLO se il token ha >=3 cifre.
      // Così "25" matcha lo spessore 25 ma non la lunghezza 250; "24" matcha cmq nulla di 2 cifre,
      // mentre "244" trova le lunghezze 244x.
      numMatch = dims.some(d => d === t) || (t.length >= 3 && dims.some(d => d.startsWith(t)));
    }
    // match nome: una parola che inizia col token, o (per token lunghi) lo include
    const nameMatch = nameWords.some(w => w.startsWith(t)) || (t.length >= 3 && normalize(p.nome).includes(t));
    return numMatch || nameMatch;
  });
}

function getFiltered() {
  const q = normalize(state.search);
  if (!q) {
    // Senza ricerca: mostro prima i prodotti con qty>0 (lavoro in corso), poi nulla per non scrollare 433 card
    const counted = state.products.filter(p => p.qty > 0)
      .sort((a,b)=> a.nome.localeCompare(b.nome,'it') || (parseFloat(a.spessore)||0)-(parseFloat(b.spessore)||0));
    return { list: counted, mode: 'counted-only' };
  }
  const tokens = q.split(' ').filter(Boolean);
  const list = state.products.filter(p => matchProduct(p, tokens))
    .sort((a,b)=>{
      // I già contati in cima, poi alfabetico+spessore
      if ((b.qty>0) !== (a.qty>0)) return (b.qty>0?1:0)-(a.qty>0?1:0);
      return a.nome.localeCompare(b.nome,'it') || (parseFloat(a.spessore)||0)-(parseFloat(b.spessore)||0);
    });
  return { list, mode: 'search' };
}

/* ---- Render ---- */
function fmtDim(v){ return (v===''||v==null) ? '–' : v; }

function escapeHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderStats(){
  const counted = state.products.filter(p=>p.qty>0).length;
  const pieces = state.products.reduce((s,p)=>s+(p.qty||0),0);
  $('statProducts').textContent = state.products.length;
  $('statCounted').textContent = counted;
  $('statPieces').textContent = pieces;
}

  box.innerHTML = list.map(p => {

/* ---- Operazioni quantità ---- */
function addQty(id, n){
  const p = state.products.find(x=>x.id===id);
  if (!p) return;
  state.history.push({ id, qty: p.qty });
  if (state.history.length > 100) state.history.shift();
  p.qty = Math.max(0, (p.qty||0) + n);
  persist();
  render();
  if (n>0) showFlash('+'+n+' → '+p.qty);
}

function setQty(id, val){
  const p = state.products.find(x=>x.id===id);
  if (!p) return;
  state.history.push({ id, qty: p.qty });
  p.qty = Math.max(0, val);
  persist(); render();
  showFlash('= '+p.qty);
}

let flashTimer=null;
function showFlash(msg){
  const f=$('flash'); f.textContent=msg; f.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>f.classList.remove('show'), 900);
}

function undo(){
  const last = state.history.pop();
  if (!last){ showFlash('Niente da annullare'); return; }
  const p = state.products.find(x=>x.id===last.id);
  if (p){ p.qty = last.qty; persist(); render(); showFlash('Annullato'); }
}

  closeMenu();

      <input type="text" id="npS" inputmode="numeric" placeholder="Spess." style="font-size:1rem;" />
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="btn ghost full" id="npCancel">Annulla</button>
      <button class="btn primary full" id="npOk">Crea</button>
    </div>
  </div></div>`;
  const m=$('modalRoot').querySelector('.modal'); m.onclick=e=>e.stopPropagation();
  $('npNome').focus();
  $('npCancel').onclick=closeModal;
  $('npOk').onclick=()=>{
    const nome = normalize($('npNome').value);
    if(!nome) return alert('Nome obbligatorio.');
    const L=$('npL').value.trim(), W=$('npW').value.trim(), S=$('npS').value.trim();
    const np = { nome, lunghezza:L, larghezza:W, spessore:S, _custom:true };
    const id = prodId(np);
    if (state.products.some(x=>x.id===id)) { alert('Prodotto già esistente.'); return; }
    state.products.push({ id, ...np, qty:0 });
    persistCustom();
    state.search = nome;
    $('searchInput').value = nome;
    $('clearSearch').classList.remove('hidden');
    state.selectedId = id;
    closeModal(); render();
  };
}

/* ---- CSV ---- */
function csvEscape(v){ const s=String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCsv(){
  const headers = ['nome','lunghezza','larghezza','spessore','quantita_totale'];
  const lines = [headers.join(',')];
  state.products.filter(p=>p.qty>0)
    .sort((a,b)=>a.nome.localeCompare(b.nome,'it'))
    .forEach(p => lines.push([p.nome,p.lunghezza,p.larghezza,p.spessore,p.qty].map(csvEscape).join(',')));
  const csv = lines.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='conteggio_magazzino_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showFlash('CSV esportato');
}

function importCsv(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange = async () => {
    const file = inp.files[0]; if(!file) return;
    const text = await file.text();
    const rows = parseCsv(text);
    if (!rows.length) return alert('CSV vuoto o non valido.');
    let applied=0, created=0;
    rows.forEach(r => {
      const nome = normalize(r.nome);
      if(!nome) return;
      const L=(r.lunghezza||'').trim(), W=(r.larghezza||'').trim(), S=(r.spessore||'').trim();
      const qty = parseInt(r.quantita_totale||r.quantita_pz||r.qty||'0',10)||0;
      const np = { nome, lunghezza:L, larghezza:W, spessore:S };
      const id = prodId(np);
      let p = state.products.find(x=>x.id===id);
      if(!p){ p={ id, ...np, qty:0, _custom:true }; state.products.push(p); created++; }
      p.qty = qty; applied++;
    });
    persist(); persistCustom(); render();
    showFlash(applied+' righe importate'+(created?(' ('+created+' nuovi)'):''));
  };
  inp.click();
}

function parseCsv(text){
  const rows=[]; let row=[],val='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(q){ if(c==='"'&&n==='"'){val+='"';i++;} else if(c==='"'){q=false;} else val+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(val);val='';} else if(c==='\n'){row.push(val);rows.push(row);row=[];val='';} else if(c!=='\r')val+=c; }
  }
  row.push(val); rows.push(row);
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.some(c=>c.trim()!=='')).map(r=>{
    const o={}; headers.forEach((h,i)=>o[h]=r[i]??''); return o;
  });
}

/* ---- Event listeners ---- */
$('searchInput').oninput = (e)=>{
  state.search = e.target.value;
  state.selectedId = null;
  $('clearSearch').classList.toggle('hidden', !e.target.value);
  renderResults();
};
$('clearSearch').onclick = ()=>{
  state.search=''; $('searchInput').value=''; $('clearSearch').classList.add('hidden');
  state.selectedId=null; renderResults(); $('searchInput').focus();
};
$('menuBtn').onclick = openMenu;

document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
});

/* ---- Boot ---- */
loadProducts();
render();
</script>
