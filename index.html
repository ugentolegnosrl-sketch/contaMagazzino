<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Conta Magazzino</title>
<style>
  :root {
    --bg:#0d1017; --panel:#161b24; --panel-2:#1e2532;
    --text:#f4f7fb; --muted:#93a0b4;
    --accent:#4d9fff; --accent-2:#54e08a;
    --danger:#ff6b6b; --warning:#f5c451;
    --border:#2b3444; --radius:16px;
    --shadow:0 8px 22px rgba(0,0,0,0.3);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .app{max-width:820px;margin:0 auto;padding:12px 12px 40px;}

  .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 60%,rgba(13,16,23,0.92));padding:10px 0 12px;}
  .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  h1{font-size:1.15rem;margin:0;font-weight:800;}
  h2{font-size:1rem;margin:0;font-weight:700;}
  .muted{color:var(--muted);}
  .tiny{font-size:0.78rem;}
  .small{font-size:0.9rem;}
  .hidden{display:none !important;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .space-between{justify-content:space-between;}

  .btn{border:1px solid var(--border);background:var(--panel-2);color:var(--text);
    border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;min-height:42px;transition:0.12s;}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.45;cursor:default;transform:none;}
  .btn.primary{background:var(--accent);color:#06101e;border-color:transparent;font-weight:700;}
  .btn.ghost{background:transparent;}
  .btn.compact{padding:7px 11px;min-height:36px;font-size:0.9rem;border-radius:10px;}
  .btn.danger{color:var(--danger);border-color:rgba(255,107,107,0.3);background:rgba(255,107,107,0.08);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;}
  .panel+.panel{margin-top:12px;}

  .stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .stat{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:8px 10px;text-align:center;}
  .stat .n{font-weight:800;font-size:1.05rem;}
  .stat.ok .n{color:var(--accent-2);}
  .stat.blue .n{color:var(--accent);}

  .crumbs{font-size:0.9rem;color:var(--muted);margin-top:4px;}
  .crumbs strong{color:var(--text);}

  /* Origini */
  .origin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;}
  .origin-card{
    background:linear-gradient(180deg,#1d2432,#171a21);
    border:1px solid var(--border);border-radius:16px;padding:14px;cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:90px;
  }
  .origin-card:hover{border-color:var(--accent);}
  .origin-card .nm{font-weight:700;font-size:1rem;}
  .origin-card .meta{color:var(--muted);font-size:0.82rem;}

  /* Scaffali */
  .shelf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;}
  .shelf-card{
    background:linear-gradient(180deg,#1d2432,#171a21);
    border:1px solid var(--border);border-radius:14px;padding:12px 8px;cursor:pointer;
    text-align:center;min-height:74px;
    display:flex;flex-direction:column;justify-content:center;gap:4px;
  }
  .shelf-card:hover{border-color:var(--accent);}
  .shelf-card.has-count{border-color:rgba(84,224,138,0.4);}
  .shelf-card .lbl{font-size:1.3rem;font-weight:800;letter-spacing:0.02em;}
  .shelf-card .mt{font-size:0.72rem;color:var(--muted);}
  .shelf-card.has-count .mt{color:var(--accent-2);}

  /* Dentro scaffale */
  .shelf-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;}
  .shelf-nav .lab{flex:1;text-align:center;font-weight:700;font-size:1.05rem;}
  .nav-btn{
    width:46px;height:46px;border-radius:14px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);font-size:1.4rem;cursor:pointer;
  }
  .nav-btn:disabled{opacity:0.3;}

  .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .filter-pill{
    padding:5px 11px;border-radius:999px;cursor:pointer;user-select:none;
    border:1px solid var(--border);background:var(--panel-2);color:var(--muted);font-size:0.85rem;
  }
  .filter-pill.active{background:rgba(77,159,255,0.16);color:var(--accent);border-color:rgba(77,159,255,0.4);}
  .filter-pill .cnt{margin-left:4px;font-size:0.76rem;opacity:0.8;}

  .product-list{display:flex;flex-direction:column;gap:10px;margin-top:12px;}

  .prod-row{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;
    display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
    transition:border-color 0.12s;
  }
  .prod-row.counted{border-color:rgba(84,224,138,0.4);}
  .prod-row.confirmed{border-color:rgba(84,224,138,0.2);background:rgba(84,224,138,0.04);}

  .level-badge{
    width:38px;height:38px;border-radius:10px;
    display:grid;place-items:center;
    background:rgba(77,159,255,0.14);color:var(--accent);
    border:1px solid rgba(77,159,255,0.26);font-weight:800;
  }
  .level-badge.no{background:var(--panel-2);color:var(--muted);border-color:var(--border);}

  .prod-info{min-width:0;}
  .prod-name{font-size:0.98rem;font-weight:700;line-height:1.25;word-break:break-word;}
  .prod-dims{color:var(--muted);font-size:0.85rem;margin-top:2px;font-variant-numeric:tabular-nums;}
  .prod-dims .x{opacity:0.5;margin:0 2px;}
  .prod-totale{font-size:0.78rem;color:var(--accent-2);margin-top:4px;}
  .prod-totale .gray{color:var(--muted);}

  .qty-cell{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:110px;}
  .qty-input{
    width:80px;padding:8px 6px;font-size:1.25rem;font-weight:800;text-align:center;
    border:2px solid var(--border);background:var(--panel-2);color:var(--text);
    border-radius:10px;outline:none;font-variant-numeric:tabular-nums;
  }
  .qty-input:focus{border-color:var(--accent);}
  .qty-input.has-val{border-color:rgba(84,224,138,0.35);color:var(--accent-2);}
  .qty-confirm{
    border:0;background:transparent;color:var(--muted);
    font-size:0.78rem;cursor:pointer;padding:2px 6px;border-radius:6px;
  }
  .qty-confirm.active{color:var(--accent-2);}
  .qty-confirm:hover{background:var(--panel-2);}

  .empty{padding:30px 16px;text-align:center;color:var(--muted);
    border:1px dashed var(--border);border-radius:14px;background:rgba(255,255,255,0.015);}

  /* Search globale (cross-scaffale) */
  .global-search{margin-top:10px;}
  #globalSearch{
    width:100%;padding:13px 14px;font-size:1.05rem;font-weight:600;
    border:2px solid var(--border);background:var(--panel);color:var(--text);
    border-radius:12px;outline:none;
  }
  #globalSearch:focus{border-color:var(--accent);}
  #globalSearch::placeholder{color:var(--muted);font-weight:400;}

  .gres-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .gres-row{
    background:var(--panel-2);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  }
  .gres-row:hover{border-color:var(--accent);}
  .gres-loc{color:var(--accent);font-size:0.85rem;}
  .gres-tot{color:var(--accent-2);font-weight:800;font-variant-numeric:tabular-nums;}

  /* Aggiungi prodotto allo scaffale */
  .add-prod-bar{
    display:flex; gap:8px; align-items:center;
    margin-top:12px;
  }
  .add-prod-btn{
    flex:1; padding:11px 14px;
    border:1px dashed var(--border); background:transparent; color:var(--accent);
    border-radius:12px; font:inherit; cursor:pointer; font-weight:700;
  }
  .add-prod-btn:hover{ background:rgba(77,159,255,0.06); border-color:var(--accent); }

  /* Modal catalog search */
  .cat-input{
    width:100%; padding:13px 14px; font-size:1rem; font-weight:600;
    border:2px solid var(--border); background:var(--panel-2); color:var(--text);
    border-radius:12px; outline:none; margin-top:10px;
  }
  .cat-input:focus{border-color:var(--accent);}
  .cat-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; max-height:50vh; overflow-y:auto; padding:2px; }
  .cat-row{
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; cursor:pointer; transition:0.1s;
  }
  .cat-row:hover{ border-color:var(--accent); background:rgba(77,159,255,0.05); }
  .cat-row.disabled{ opacity:0.4; cursor:not-allowed; }
  .cat-row.disabled:hover{ border-color:var(--border); background:var(--panel-2); }
  .cat-row .nm{ font-weight:700; font-size:0.95rem; }
  .cat-row .dm{ color:var(--muted); font-size:0.82rem; margin-top:2px; }
  .cat-row .badge{ display:inline-block; font-size:0.72rem; padding:2px 7px; border-radius:999px;
    background:rgba(245,196,81,0.14); color:var(--warning); border:1px solid rgba(245,196,81,0.3); margin-left:6px; vertical-align:middle; }
  .cat-create{
    margin-top:10px; padding:12px; border-radius:12px;
    background:rgba(84,224,138,0.08); border:1px solid rgba(84,224,138,0.3);
    color:var(--accent-2); text-align:center; cursor:pointer; font-weight:700;
  }
  .cat-create:hover{ background:rgba(84,224,138,0.14); }

  /* Form new product */
  .np-form{ display:grid; gap:8px; margin-top:10px; }
  .np-form .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .np-form input{
    width:100%; padding:12px; font-size:1rem;
    border:2px solid var(--border); background:var(--panel-2); color:var(--text);
    border-radius:10px; outline:none;
  }
  .np-form input:focus{ border-color:var(--accent); }
  .np-form label{ font-size:0.82rem; color:var(--muted); }
  .np-form .row3 label{ display:flex; flex-direction:column; gap:4px; }
  .level-pick{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .level-chip{
    padding:6px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer; font-weight:700; min-width:36px; text-align:center;
  }
  .level-chip.active{ background:var(--accent); color:#06101e; border-color:transparent; }

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;display:grid;place-items:center;padding:16px;}
  .modal{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);max-height:90vh;overflow:auto;}
  .modal h3{margin:0 0 4px;}

  /* Menu */
  .menu-sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,0.5);display:flex;align-items:flex-start;justify-content:flex-end;padding:12px;}
  .menu-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:8px;min-width:220px;box-shadow:var(--shadow);}
  .menu-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:13px 14px;border-radius:10px;font:inherit;cursor:pointer;}
  .menu-item:hover{background:var(--panel-2);}
  .menu-item.danger{color:var(--danger);}
  .menu-sep{height:1px;background:var(--border);margin:6px 8px;}

  .flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--accent-2);color:#06180c;font-weight:800;padding:10px 20px;border-radius:999px;z-index:120;
    box-shadow:var(--shadow);opacity:0;transition:opacity 0.2s,transform 0.2s;pointer-events:none;font-size:0.95rem;}
  .flash.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  @media (max-width:520px){
    .origin-grid{grid-template-columns:1fr;}
    .shelf-grid{grid-template-columns:repeat(3,1fr);}
    .qty-cell{min-width:96px;}
    .qty-input{width:72px;font-size:1.1rem;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title-row">
      <h1 id="pageTitle">Conta Magazzino</h1>
      <div class="row">
        <button class="btn compact ghost hidden" id="backBtn">← Indietro</button>
        <button class="btn compact" id="menuBtn">☰</button>
      </div>
    </div>
    <div class="crumbs" id="crumbs">Tocca un'origine per iniziare il giro fisico.</div>
  </div>

  <!-- HOME: lista origini -->
  <section id="screenHome">
    <div class="panel">
      <div class="global-search">
        <input type="text" id="globalSearch" inputmode="search" autocomplete="off" placeholder="Cerca prodotto ovunque: es. mult 18 244, osb 25"/>
      </div>
      <div class="stats">
        <div class="stat blue"><div class="muted tiny">Prodotti distinti</div><div class="n" id="stProducts">0</div></div>
        <div class="stat ok"><div class="muted tiny">Pezzi totali</div><div class="n" id="stPieces">0</div></div>
        <div class="stat blue"><div class="muted tiny">Scaffali con conteggio</div><div class="n" id="stShelves">0</div></div>
      </div>
    </div>

    <div id="globalResults" class="hidden"></div>

    <div id="originPanel" class="panel">
      <h2>Origini</h2>
      <div id="originGrid" class="origin-grid"></div>
    </div>
  </section>

  <!-- ORIGINE: scaffali -->
  <section id="screenOrigin" class="hidden">
    <div class="panel">
      <div class="row space-between">
        <h2 id="originTitle">—</h2>
        <span class="muted small" id="originMeta"></span>
      </div>
      <div id="shelfGrid" class="shelf-grid"></div>
    </div>
  </section>

  <!-- SCAFFALE: contenuto -->
  <section id="screenShelf" class="hidden">
    <div class="panel">
      <div class="shelf-nav">
        <button class="nav-btn" id="prevShelfBtn">‹</button>
        <div class="lab" id="shelfLabel">—</div>
        <button class="nav-btn" id="nextShelfBtn">›</button>
      </div>
      <div class="muted small" id="shelfMeta" style="text-align:center;margin-top:6px;"></div>
      <div class="filter-bar">
        <span class="filter-pill active" data-f="all">Tutti <span class="cnt" id="fnAll">0</span></span>
        <span class="filter-pill" data-f="pending">Da contare <span class="cnt" id="fnPending">0</span></span>
        <span class="filter-pill" data-f="counted">Contati <span class="cnt" id="fnCounted">0</span></span>
      </div>
      <div class="add-prod-bar">
        <button class="add-prod-btn" id="addProdBtn">+ Aggiungi prodotto trovato qui</button>
      </div>
    </div>
    <div id="productList" class="product-list"></div>
  </section>
</div>

<div id="flash" class="flash"></div>
<div id="modalRoot" class="hidden"></div>
<div id="menuRoot" class="hidden"></div>

:"LISTELLARE BIANCO DIFETTATO 5 STRATI SIFAR|305|130|18","origine":"RETRO FALEGNAMERIA","shelf":"2f","level":"3","row":"2","letter":"f"},{"pid":"LISTELLARE BIANCO DIFETTATO 5 STRATI SIFAR|305|130|18","origine":"RETRO FALEGNAMERIA","shelf":"2f","level":"3","row":"2","letter":"f"},{"pid":"MULTISTRATO BIANCO FRASSINATO|305|130|25","origine":"RETRO FALEGNAMERIA","shelf":"2f","level":"5","row":"2","letter":"f"},{"pid":"MULTISTRATO BILAMINATO LAVA|305|122|18","origine":"RETRO FALEGNAMERIA","shelf":"2f","level":"5","row":"2","letter":"f"},{"pid":"NOBILITATO CARMEN A396 PS19|366|183|18","origine":"SCAFFALI","shelf":"1b","level":"2","row":"1","letter":"b"},{"pid":"MULTISTRATO BILAMINATO BIANCO LISCIO|244|122|18","origine":"SCAFFALI","shelf":"3h","level":"1","row":"3","letter":"h"}]};
const STORAGE_KEY = 'conta_magaz_v2';

const state = {
  products: [],          // [{id, nome, L, W, sp}]
  placements: [],        // [{id (pid+|+origine+|+shelf), pid, origine, shelf, level, row, letter, qty, confirmed}]
  screen: 'home',        // home | origin | shelf
  currentOrigin: null,
  currentShelf: null,
  filter: 'all',
  globalSearch: ''
};

const $ = (id) => document.getElementById(id);

/* ──────────── ID & helpers ──────────── */
function placementId(pid, origine, shelf, level){
  return [pid, origine, shelf, level].join('::');
}
function normalize(s){ return String(s||'').toUpperCase().replace(/\s+/g,' ').trim(); }
function escapeHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDim(v){ return (v==='' || v==null) ? '–' : v; }

/* ──────────── Persistenza ──────────── */
function persist(){
  const qty = {};
  state.placements.forEach(pl => {
    if (pl.qty > 0 || pl.confirmed) qty[pl.id] = { q: pl.qty, c: !!pl.confirmed };
  });
  // Salvo anche i prodotti custom aggiunti
  const custom = state.products.filter(p => p._custom);
  const customPlacements = state.placements.filter(p => p._custom);
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ qty, custom, customPlacements, savedAt: new Date().toISOString() }));
}

function load(){
  let saved = { qty:{}, custom:[], customPlacements:[] };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) saved = { ...saved, ...JSON.parse(raw) };
  } catch {}

  state.products = [...SEED.products, ...(saved.custom||[])];

  // Costruisco placements dal seed
  state.placements = SEED.placements.map(p => {
    const id = placementId(p.pid, p.origine, p.shelf, p.level);
    const s = saved.qty[id] || {};
    return {
      id, pid: p.pid, origine: p.origine, shelf: p.shelf,
      level: p.level, row: p.row, letter: p.letter,
      qty: s.q || 0, confirmed: !!s.c
    };
  });
  // Aggiungo i custom placements
  (saved.customPlacements||[]).forEach(cp => {
    const id = placementId(cp.pid, cp.origine, cp.shelf, cp.level);
    const s = saved.qty[id] || {};
    state.placements.push({ ...cp, id, qty:s.q||0, confirmed:!!s.c, _custom:true });
  });
}

/* ──────────── Derivati ──────────── */
function getProduct(pid){ return state.products.find(p => p.id === pid); }
function totalForProduct(pid){
  return state.placements.filter(p => p.pid === pid).reduce((s,p) => s + (p.qty||0), 0);
}
function placementsForShelf(origine, shelf){
  return state.placements.filter(p => p.origine === origine && p.shelf === shelf);
}
function originList(){
  const set = new Map();
  state.placements.forEach(p => {
    if (!set.has(p.origine)) set.set(p.origine, { name: p.origine, shelves: new Set(), count: 0 });
    set.get(p.origine).shelves.add(p.shelf);
    set.get(p.origine).count++;
  });
  return [...set.values()].sort((a,b) => a.name.localeCompare(b.name,'it'));
}
function shelvesForOrigin(origine){
  const map = new Map();
  state.placements.filter(p => p.origine === origine).forEach(p => {
    if (!map.has(p.shelf)) map.set(p.shelf, { key: p.shelf, row: p.row, letter: p.letter, items:0, counted:0, confirmed:0 });
    const s = map.get(p.shelf);
    s.items++;
    if (p.qty > 0) s.counted++;
    if (p.confirmed) s.confirmed++;
  });
  return [...map.values()].sort((a,b) => {
    const ar = parseInt(a.row||'0',10), br = parseInt(b.row||'0',10);
    if (ar !== br) return ar - br;
    return (a.letter||'').localeCompare(b.letter||'','it');
  });
}

/* ──────────── Layout & navigazione ──────────── */
function setScreen(s, opts={}){
  state.screen = s;
  if (opts.origin !== undefined) state.currentOrigin = opts.origin;
  if (opts.shelf  !== undefined) state.currentShelf  = opts.shelf;
  if (s === 'shelf') state.filter = 'all';
  render();
}

function updateTopbar(){
  $('screenHome').classList.toggle('hidden', state.screen !== 'home');
  $('screenOrigin').classList.toggle('hidden', state.screen !== 'origin');
  $('screenShelf').classList.toggle('hidden', state.screen !== 'shelf');
  $('backBtn').classList.toggle('hidden', state.screen === 'home');

  if (state.screen === 'home') {
    $('pageTitle').textContent = 'Conta Magazzino';
    $('crumbs').innerHTML = 'Tocca un\'origine per iniziare il giro fisico.';
  } else if (state.screen === 'origin') {
    $('pageTitle').textContent = 'Scaffali';
    $('crumbs').innerHTML = '<strong>' + escapeHtml(state.currentOrigin) + '</strong>';
  } else {
    $('pageTitle').textContent = 'Scaffale';
    $('crumbs').innerHTML = '<strong>' + escapeHtml(state.currentOrigin) + '</strong> · ' + escapeHtml(state.currentShelf);
  }
}

/* ──────────── HOME ──────────── */
function renderHome(){
  const pieces = state.placements.reduce((s,p)=>s+(p.qty||0),0);
  const counted = state.placements.filter(p=>p.qty>0).length;
  $('stProducts').textContent = state.products.length;
  $('stPieces').textContent = pieces;
  $('stShelves').textContent = new Set(state.placements.filter(p=>p.qty>0).map(p=>p.origine+'/'+p.shelf)).size;

  const origins = originList();
  $('originGrid').innerHTML = origins.map(o => {
    const counted = state.placements.filter(p => p.origine === o.name && p.qty>0).length;
    return `<div class="origin-card" data-origin="${escapeHtml(o.name)}">
      <div>
        <div class="nm">${escapeHtml(o.name)}</div>
        <div class="meta">${o.shelves.size} scaffali · ${o.count} prodotti</div>
      </div>
      <div class="meta">${counted ? '<span style="color:var(--accent-2)">'+counted+' contati</span>' : 'Da contare'}</div>
    </div>`;
  }).join('');
  $('originGrid').querySelectorAll('[data-origin]').forEach(c =>
    c.onclick = () => setScreen('origin', { origin: c.dataset.origin })
  );

  renderGlobalSearch();
}

function renderGlobalSearch(){
  const q = normalize(state.globalSearch);
  const box = $('globalResults');
  const orig = $('originPanel');
  if (!q) {
    box.classList.add('hidden'); orig.classList.remove('hidden'); box.innerHTML = ''; return;
  }
  const tokens = q.split(' ').filter(Boolean);
  const matched = state.products.filter(p => matchTokens(p, tokens));
  box.classList.remove('hidden'); orig.classList.add('hidden');

  if (!matched.length) {
    box.innerHTML = '<div class="panel"><div class="empty">Nessun prodotto trovato per "'+escapeHtml(q)+'"</div></div>';
    return;
  }

  // Per ogni prodotto: mostro tutte le sue posizioni con la qty corrente
  const html = ['<div class="panel"><h2>Risultati ricerca</h2>'];
  matched.slice(0, 80).forEach(p => {
    const places = state.placements.filter(pl => pl.pid === p.id);
    const total = places.reduce((s,pl)=>s+(pl.qty||0),0);
    html.push(`<div style="margin-top:14px;">
      <div style="font-weight:700;">${escapeHtml(p.nome)}</div>
      <div class="muted small" style="margin-bottom:6px;">${escapeHtml(fmtDim(p.L))}<span class="x">×</span>${escapeHtml(fmtDim(p.W))}<span class="x">×</span>${escapeHtml(fmtDim(p.sp))} · totale: <span class="gres-tot">${total}</span></div>
      <div class="gres-list">
        ${places.map(pl => `<div class="gres-row" data-go-origin="${escapeHtml(pl.origine)}" data-go-shelf="${escapeHtml(pl.shelf)}">
          <div>
            <span class="gres-loc">${escapeHtml(pl.origine)} · ${escapeHtml(pl.shelf)}${pl.level ? ' (rip. '+escapeHtml(pl.level)+')' : ''}</span>
          </div>
          <div class="gres-tot">${pl.qty||0}</div>
        </div>`).join('')}
      </div>
    </div>`);
  });
  if (matched.length > 80) html.push(`<div class="tiny muted" style="margin-top:8px;">+ altri ${matched.length-80} prodotti</div>`);
  html.push('</div>');
  box.innerHTML = html.join('');

  box.querySelectorAll('[data-go-origin]').forEach(r =>
    r.onclick = () => {
      const o = r.dataset.goOrigin, s = r.dataset.goShelf;
      state.globalSearch = ''; $('globalSearch').value = '';
      setScreen('shelf', { origin: o, shelf: s });
    }
  );
}

function matchTokens(p, tokens){
  const nameWords = normalize(p.nome).split(' ');
  const dims = [String(p.L), String(p.W), String(p.sp)];
  return tokens.every(tok => {
    const t = tok.toUpperCase();
    const isNum = /^[0-9]+([.,][0-9]+)?$/.test(t);
    let numMatch = false;
    if (isNum) numMatch = dims.some(d => d === t) || (t.length >= 3 && dims.some(d => d.startsWith(t)));
    const nameMatch = nameWords.some(w => w.startsWith(t)) || (t.length >= 3 && normalize(p.nome).includes(t));
    return numMatch || nameMatch;
  });
}

/* ──────────── ORIGIN ──────────── */
function renderOrigin(){
  if (!state.currentOrigin) return;
  const shelves = shelvesForOrigin(state.currentOrigin);
  $('originTitle').textContent = state.currentOrigin;
  const totItems = shelves.reduce((s,x)=>s+x.items,0);
  const totCounted = shelves.reduce((s,x)=>s+x.counted,0);
  $('originMeta').textContent = `${shelves.length} scaffali · ${totCounted}/${totItems} contati`;

  $('shelfGrid').innerHTML = shelves.map(s => {
    const allCounted = s.counted === s.items && s.items > 0;
    return `<div class="shelf-card ${allCounted ? 'has-count' : ''}" data-shelf="${escapeHtml(s.key)}">
      <div class="lbl">${escapeHtml(s.key)}</div>
      <div class="mt">${s.counted}/${s.items}</div>
    </div>`;
  }).join('');
  $('shelfGrid').querySelectorAll('[data-shelf]').forEach(c =>
    c.onclick = () => setScreen('shelf', { shelf: c.dataset.shelf })
  );
}

/* ──────────── SHELF ──────────── */
function renderShelf(){
  if (!state.currentOrigin || !state.currentShelf) return;
  const shelves = shelvesForOrigin(state.currentOrigin);
  const idx = shelves.findIndex(s => s.key === state.currentShelf);
  $('shelfLabel').textContent = state.currentShelf;
  $('shelfMeta').textContent = state.currentOrigin + (idx>=0 ? ` · ${idx+1}/${shelves.length}` : '');
  $('prevShelfBtn').disabled = idx <= 0;
  $('nextShelfBtn').disabled = idx < 0 || idx >= shelves.length - 1;

  const allPlacements = placementsForShelf(state.currentOrigin, state.currentShelf);
  // Raggruppo per (pid + level), per mostrare il livello come "riscontro visivo"
  // Ma il pid è già nome+dim, quindi raggruppo proprio per quello per non duplicare lo stesso prodotto sullo stesso ripiano
  // Caso che NON dovrebbe esistere nei dati seed (verificato), comunque sommo per sicurezza
  const rows = allPlacements.map(pl => ({...pl, prod: getProduct(pl.pid)})).filter(r=>r.prod);

  // Conteggi filtri
  const counted = rows.filter(r=>r.qty>0).length;
  const pending = rows.length - counted;
  $('fnAll').textContent = rows.length;
  $('fnPending').textContent = pending;
  $('fnCounted').textContent = counted;

  let filtered = rows;
  if (state.filter === 'pending') filtered = rows.filter(r=>!r.qty);
  if (state.filter === 'counted') filtered = rows.filter(r=>r.qty>0);

  // Ordino: per ripiano numerico, poi per nome
  filtered.sort((a,b) => {
    const al = parseInt(a.level||'0',10), bl = parseInt(b.level||'0',10);
    if (al !== bl) return al - bl;
    return a.prod.nome.localeCompare(b.prod.nome,'it');
  });

  if (!filtered.length) {
    $('productList').innerHTML = '<div class="empty">Nessun prodotto in questo filtro.</div>';
    return;
  }

  $('productList').innerHTML = filtered.map(r => {
    const p = r.prod;
    const total = totalForProduct(r.pid);
    const otherPlaces = state.placements.filter(x => x.pid === r.pid && x.id !== r.id).length;
    return `<div class="prod-row ${r.qty>0?'counted':''}" data-placement="${escapeHtml(r.id)}">
      <div class="level-badge ${r.level?'':'no'}">${escapeHtml(r.level || '?')}</div>
      <div class="prod-info">
        <div class="prod-name">${escapeHtml(p.nome)}</div>
        <div class="prod-dims">${escapeHtml(fmtDim(p.L))}<span class="x">×</span>${escapeHtml(fmtDim(p.W))}<span class="x">×</span>${escapeHtml(fmtDim(p.sp))}</div>
        ${otherPlaces ? `<div class="prod-totale">Totale prodotto: <strong>${total}</strong> <span class="gray">(qui + ${otherPlaces} altro/i)</span></div>` : ''}
      </div>
      <div class="qty-cell">
        <input type="number" inputmode="numeric" class="qty-input ${r.qty>0?'has-val':''}" data-qty="${escapeHtml(r.id)}" value="${r.qty || ''}" placeholder="0" />
      </div>
    </div>`;
  }).join('');

  // Bind: salva al blur o al cambio
  $('productList').querySelectorAll('[data-qty]').forEach(inp => {
    inp.addEventListener('change', () => saveQty(inp.dataset.qty, inp.value));
    inp.addEventListener('blur', () => saveQty(inp.dataset.qty, inp.value));
    inp.addEventListener('focus', () => inp.select());
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        // Focus al prossimo input
        const all = [...$('productList').querySelectorAll('[data-qty]')];
        const i = all.indexOf(inp);
        if (i >= 0 && i < all.length - 1) all[i+1].focus();
        else inp.blur();
      }
    });
  });
}

function saveQty(placementId, val){
  const pl = state.placements.find(p => p.id === placementId);
  if (!pl) return;
  let v = parseInt(val, 10);
  if (!Number.isFinite(v) || v < 0) v = 0;
  const prev = pl.qty;
  pl.qty = v;
  persist();
  // Re-render leggero: aggiorno solo i totali del prodotto in pagina e i contatori
  updateInlineTotals(pl.pid);
  updateShelfCounters();
  if (v !== prev) {
    // Update visual class
    const inp = $('productList').querySelector(`[data-qty="${CSS.escape(placementId)}"]`);
    if (inp) {
      inp.classList.toggle('has-val', v > 0);
      const row = inp.closest('.prod-row');
      if (row) row.classList.toggle('counted', v > 0);
    }
  }
}

function updateInlineTotals(pid){
  const total = totalForProduct(pid);
  $('productList').querySelectorAll('.prod-row').forEach(row => {
    const plId = row.dataset.placement;
    const pl = state.placements.find(p => p.id === plId);
    if (!pl || pl.pid !== pid) return;
    const totEl = row.querySelector('.prod-totale strong');
    if (totEl) totEl.textContent = total;
  });
}

function updateShelfCounters(){
  if (state.screen !== 'shelf') return;
  const rows = placementsForShelf(state.currentOrigin, state.currentShelf);
  const counted = rows.filter(r=>r.qty>0).length;
  const pending = rows.length - counted;
  $('fnAll').textContent = rows.length;
  $('fnPending').textContent = pending;
  $('fnCounted').textContent = counted;
}

function goToAdjacentShelf(dir){
  const shelves = shelvesForOrigin(state.currentOrigin);
  const idx = shelves.findIndex(s => s.key === state.currentShelf);
  const next = idx + dir;
  if (next < 0 || next >= shelves.length) return;
  setScreen('shelf', { shelf: shelves[next].key });
}

/* ──────────── Aggiungi prodotto allo scaffale ──────────── */
function closeModal(){
  $('modalRoot').classList.add('hidden');
  $('modalRoot').innerHTML = '';
}

function openAddProductModal(){
  // Prodotti già presenti in QUESTO scaffale → da disabilitare per evitare duplicati
  const existingPids = new Set(
    placementsForShelf(state.currentOrigin, state.currentShelf).map(p => p.pid)
  );
  const shelfLabel = state.currentShelf;
  const origineLabel = state.currentOrigin;

  $('modalRoot').classList.remove('hidden');
  $('modalRoot').innerHTML = `<div class="modal-backdrop"><div class="modal">
    <h3>Aggiungi a ${escapeHtml(origineLabel)} · ${escapeHtml(shelfLabel)}</h3>
    <div class="muted small">Cerca un prodotto dal catalogo, o crea uno nuovo.</div>
    <input type="text" id="catSearch" class="cat-input" placeholder="Cerca: es. mult 18 244, osb 25" inputmode="search" autocomplete="off" />
    <div id="catList" class="cat-list"></div>
    <div id="catCreateBox"></div>
    <div class="row" style="margin-top:14px; justify-content:flex-end;">
      <button class="btn ghost" id="catCancel">Annulla</button>
    </div>
  </div></div>`;

  const m = $('modalRoot').querySelector('.modal');
  m.onclick = e => e.stopPropagation();
  m.ontouchstart = e => e.stopPropagation();
  $('catCancel').onclick = closeModal;

  const inp = $('catSearch');
  inp.focus();

  function renderCatList(){
    const q = normalize(inp.value);
    const tokens = q.split(' ').filter(Boolean);
    let matches = state.products;
    if (tokens.length) {
      matches = state.products.filter(p => matchTokens(p, tokens));
    } else {
      // Senza query: mostra solo i primi 30 per non saturare
      matches = state.products.slice(0, 30);
    }
    const list = matches.slice(0, 100).map(p => {
      const already = existingPids.has(p.id);
      return `<div class="cat-row ${already ? 'disabled' : ''}" data-pid="${escapeHtml(p.id)}" ${already ? 'data-already="1"' : ''}>
        <div class="nm">${escapeHtml(p.nome)}${already ? '<span class="badge">già qui</span>' : ''}</div>
        <div class="dm">${escapeHtml(fmtDim(p.L))} × ${escapeHtml(fmtDim(p.W))} × ${escapeHtml(fmtDim(p.sp))}</div>
      </div>`;
    }).join('');
    $('catList').innerHTML = list || '<div class="empty">Nessun prodotto in catalogo per "'+escapeHtml(q)+'"</div>';

    // Mostra il "crea nuovo" se c'è una query e non c'è match esatto
    const exact = tokens.length && state.products.some(p =>
      normalize(p.nome) === q || tokens.every(t => normalize(p.nome).split(' ').includes(t))
    );
    if (tokens.length) {
      $('catCreateBox').innerHTML = `<div class="cat-create" id="catCreate">+ Crea nuovo prodotto "${escapeHtml(inp.value.trim())}"</div>`;
      $('catCreate').onclick = () => openNewProductForm(inp.value.trim());
    } else {
      $('catCreateBox').innerHTML = `<div class="cat-create" id="catCreate">+ Crea nuovo prodotto</div>`;
      $('catCreate').onclick = () => openNewProductForm('');
    }

    $('catList').querySelectorAll('[data-pid]').forEach(row => {
      if (row.dataset.already) return;
      row.onclick = () => selectProductForShelf(row.dataset.pid);
    });
  }

  inp.oninput = renderCatList;
  renderCatList();
}

function selectProductForShelf(pid){
  const p = getProduct(pid);
  if (!p) return;
  // Chiedi il ripiano (preconfigurato da uno dei ripiani esistenti se possibile)
  askLevelAndCreate(p);
}

function askLevelAndCreate(prod, prefillLevel=''){
  // Trovo i ripiani usati in questo scaffale per suggerirne uno
  const usedLevels = [...new Set(
    placementsForShelf(state.currentOrigin, state.currentShelf)
      .map(p => p.level).filter(Boolean)
  )].sort((a,b) => parseInt(a,10) - parseInt(b,10));

  // Trovo le info di shelf per costruire la posizione (row+letter)
  const sample = placementsForShelf(state.currentOrigin, state.currentShelf)[0];
  const row = sample ? sample.row : '';
  const letter = sample ? sample.letter : state.currentShelf;

  $('modalRoot').innerHTML = `<div class="modal-backdrop"><div class="modal">
    <h3>Ripiano di "${escapeHtml(prod.nome)}"</h3>
    <div class="muted small">In quale ripiano dello scaffale ${escapeHtml(state.currentShelf)}?</div>
    <div class="level-pick" id="levelPick">
      ${[1,2,3,4,5,6,7,8].map(n => `<div class="level-chip ${String(n)===prefillLevel?'active':''}" data-level="${n}">${n}</div>`).join('')}
      <div class="level-chip ${prefillLevel===''?'active':''}" data-level="">—</div>
    </div>
    <div class="np-form" style="margin-top:10px;">
      <label>Oppure inserisci a mano
        <input type="text" id="levelCustom" inputmode="numeric" value="${escapeHtml(prefillLevel)}" placeholder="es. 3"/>
      </label>
    </div>
    <div class="row" style="margin-top:14px; justify-content:flex-end;">
      <button class="btn ghost" id="lvCancel">Annulla</button>
      <button class="btn primary" id="lvOk">Aggiungi allo scaffale</button>
    </div>
  </div></div>`;

  const m = $('modalRoot').querySelector('.modal');
  m.onclick = e => e.stopPropagation();
  m.ontouchstart = e => e.stopPropagation();

  let pickedLevel = prefillLevel;
  $('modalRoot').querySelectorAll('[data-level]').forEach(c => {
    c.onclick = () => {
      $('modalRoot').querySelectorAll('[data-level]').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      pickedLevel = c.dataset.level;
      $('levelCustom').value = pickedLevel;
    };
  });
  $('levelCustom').oninput = () => {
    $('modalRoot').querySelectorAll('[data-level]').forEach(x => x.classList.remove('active'));
    pickedLevel = $('levelCustom').value.trim();
  };

  $('lvCancel').onclick = closeModal;
  $('lvOk').onclick = () => {
    const level = ($('levelCustom').value.trim()) || pickedLevel || '';
    createPlacement(prod.id, state.currentOrigin, state.currentShelf, level, row, letter);
    closeModal();
    showFlash('Prodotto aggiunto');
  };
}

function createPlacement(pid, origine, shelf, level, row, letter){
  const id = placementId(pid, origine, shelf, level);
  if (state.placements.some(p => p.id === id)) {
    // Già esiste con lo stesso ripiano → metto il focus su quello
    state.filter = 'all';
    render();
    setTimeout(() => {
      const inp = $('productList').querySelector(`[data-qty="${CSS.escape(id)}"]`);
      if (inp) { inp.focus(); inp.select(); }
    }, 50);
    return;
  }
  state.placements.push({
    id, pid, origine, shelf, level, row, letter,
    qty: 0, confirmed: false, _custom: true
  });
  persist();
  render();
  // Focus sull'input appena creato
  setTimeout(() => {
    const inp = $('productList').querySelector(`[data-qty="${CSS.escape(id)}"]`);
    if (inp) { inp.focus(); inp.select(); }
  }, 50);
}

function openNewProductForm(prefillName){
  $('modalRoot').innerHTML = `<div class="modal-backdrop"><div class="modal">
    <h3>Crea nuovo prodotto</h3>
    <div class="muted small">Il prodotto verrà aggiunto al catalogo e poi a questo scaffale.</div>
    <div class="np-form">
      <label>Nome
        <input type="text" id="npNome" placeholder="es. MULTISTRATO BETULLA" value="${escapeHtml(prefillName.toUpperCase())}" />
      </label>
      <div class="row3">
        <label>Lunghezza<input type="text" id="npL" inputmode="numeric" placeholder="es. 250"/></label>
        <label>Larghezza<input type="text" id="npW" inputmode="numeric" placeholder="es. 125"/></label>
        <label>Spessore<input type="text" id="npS" inputmode="numeric" placeholder="es. 18"/></label>
      </div>
    </div>
    <div class="row" style="margin-top:14px; justify-content:flex-end;">
      <button class="btn ghost" id="npCancel">Annulla</button>
      <button class="btn primary" id="npOk">Crea e aggiungi</button>
    </div>
  </div></div>`;
  const m = $('modalRoot').querySelector('.modal');
  m.onclick = e => e.stopPropagation();
  m.ontouchstart = e => e.stopPropagation();

  $('npNome').focus();
  $('npCancel').onclick = closeModal;
  $('npOk').onclick = () => {
    const nome = normalize($('npNome').value);
    if (!nome) return alert('Nome obbligatorio.');
    const L = $('npL').value.trim();
    const W = $('npW').value.trim();
    const S = $('npS').value.trim();
    const pid = `${nome}|${L}|${W}|${S}`;
    // Già esiste in catalogo?
    if (state.products.some(p => p.id === pid)) {
      if (!confirm('Esiste già un prodotto con questo nome e queste dimensioni nel catalogo. Vuoi aggiungerlo allo scaffale?')) return;
    } else {
      state.products.push({ id: pid, nome, L, W, sp: S, _custom: true });
      persist();
    }
    // Vado allo step ripiano
    askLevelAndCreate(getProduct(pid));
  };
}
function openMenu(){
  $('menuRoot').classList.remove('hidden');
  $('menuRoot').innerHTML = `<div class="menu-sheet"><div class="menu-card">
    <button class="menu-item" data-m="export">⬇ Esporta CSV totali per prodotto</button>
    <button class="menu-item" data-m="exportFull">⬇ Esporta CSV dettaglio per posizione</button>
    <div class="menu-sep"></div>
    <button class="menu-item danger" data-m="reset">🧹 Azzera tutti i conteggi</button>
  </div></div>`;
  const sheet = $('menuRoot').querySelector('.menu-sheet');
  sheet.onclick = e => { if (e.target === sheet) closeMenu(); };
  $('menuRoot').querySelectorAll('[data-m]').forEach(b =>
    b.onclick = () => { closeMenu(); handleMenu(b.dataset.m); }
  );
}
function closeMenu(){ $('menuRoot').classList.add('hidden'); $('menuRoot').innerHTML = ''; }

function handleMenu(act){
  if (act === 'export') exportTotals();
  else if (act === 'exportFull') exportDetail();
  else if (act === 'reset') {
    if (!confirm('Azzerare TUTTI i conteggi? La struttura origini/scaffali resta.')) return;
    state.placements.forEach(p => { p.qty = 0; });
    persist(); render(); showFlash('Conteggi azzerati');
  }
}

function csvEscape(v){ const s = String(v??''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }

function exportTotals(){
  const headers = ['nome','lunghezza','larghezza','spessore','quantita_totale'];
  const lines = [headers.join(',')];
  state.products.forEach(p => {
    const tot = totalForProduct(p.id);
    if (tot > 0) lines.push([p.nome, p.L, p.W, p.sp, tot].map(csvEscape).join(','));
  });
  download('totali_prodotti_'+stamp()+'.csv', lines.join('\n'));
  showFlash('CSV totali esportato');
}

function exportDetail(){
  const headers = ['nome','lunghezza','larghezza','spessore','origine','scaffale','ripiano','quantita'];
  const lines = [headers.join(',')];
  state.placements.forEach(pl => {
    if (!pl.qty) return;
    const p = getProduct(pl.pid);
    if (!p) return;
    lines.push([p.nome, p.L, p.W, p.sp, pl.origine, pl.shelf, pl.level, pl.qty].map(csvEscape).join(','));
  });
  download('dettaglio_posizioni_'+stamp()+'.csv', lines.join('\n'));
  showFlash('CSV dettaglio esportato');
}

function stamp(){ return new Date().toISOString().slice(0,10); }
function download(name, content){
  const blob = new Blob([content], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

let flashTimer = null;
function showFlash(msg){
  $('flash').textContent = msg;
  $('flash').classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => $('flash').classList.remove('show'), 1100);
}

/* ──────────── Render globale ──────────── */
function render(){
  updateTopbar();
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'origin') renderOrigin();
  else if (state.screen === 'shelf') renderShelf();
}

/* ──────────── Event listeners ──────────── */
$('backBtn').onclick = () => {
  if (state.screen === 'shelf') setScreen('origin');
  else if (state.screen === 'origin') setScreen('home');
};
$('menuBtn').onclick = openMenu;

$('globalSearch').oninput = e => { state.globalSearch = e.target.value; renderGlobalSearch(); };

$('prevShelfBtn').onclick = () => goToAdjacentShelf(-1);
$('nextShelfBtn').onclick = () => goToAdjacentShelf(1);
$('addProdBtn').onclick = openAddProductModal;

document.querySelectorAll('[data-f]').forEach(p =>
  p.onclick = () => {
    document.querySelectorAll('[data-f]').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    state.filter = p.dataset.f;
    renderShelf();
  }
);

document.addEventListener('keydown', e => {
  if (state.screen === 'shelf') {
    // Frecce solo se nessun input è in focus
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); goToAdjacentShelf(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); goToAdjacentShelf(1); }
  }
});

/* ──────────── Boot ──────────── */
load();
render();
</script>
